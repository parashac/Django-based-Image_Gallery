{% extends "base.html" %}

{% block content %}

<style>
.gallery-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
}

.gallery-card {
    border: 1px solid #ddd;
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
}

.gallery-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.gallery-info {
    padding: 10px;
    text-align: center;
}

.delete-btn {
    margin-top: 6px;
    padding: 6px 12px;
    background: #c0392b;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
}

.delete-btn:hover {
    background: #a93226;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
}

.add-btn {
    padding: 8px 14px;
    background: #333;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-size: 14px;
}
</style>

<div class="top-bar">
    <h2>Image Gallery</h2>
    <a href="{% url 'upload_image' %}" class="add-btn">+ Add Image</a>
</div>

<div class="gallery-container">
    {% for img in images %}
        <div class="gallery-card">
            <img src="{{ img.image.url }}" alt="{{ img.title }}">

            <div class="gallery-info">
                <strong>{{ img.title }}</strong>

                <form action="{% url 'delete_image' img.id %}"
                      method="POST"
                      onsubmit="return confirm('Delete this image?');">
                    {% csrf_token %}
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
            </div>
        </div>
    {% empty %}
        <p style="padding:20px;">No images uploaded yet.</p>
    {% endfor %}
</div>

{% endblock %}
